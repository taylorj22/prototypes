const CA_PROVINCES = ["ontario","british columbia","alberta","quebec","manitoba","saskatchewan","nova scotia","new brunswick","bc","ab","on","qc","ottawa","saskatchewan"];
function getCandidateRegion(state) {
  const s = (state || "").toLowerCase();
  return CA_PROVINCES.some(p => s.includes(p)) ? "Canada" : "US";
}
function getCandidateSegment(p) {
  const usesBiz = p.aiUseBiz !== "None" && p.aiUseBiz !== "";
  const regularly = p.aiUseExt === "Yes, regularly";
  const triedFew = p.aiUseExt === "Yes, tried a few";
  const open = p.aiUseExt === "No, but open";
  const notInterested = p.aiUseExt === "No, not interested";
  const bullish = p.view === "major opportunity";
  if (usesBiz && (regularly || triedFew) && p.comfort >= 4) return "Active Adopters";
  if (usesBiz && regularly) return "Active Adopters";
  if (regularly && p.comfort >= 4 && bullish) return "Active Adopters";
  if ((open || triedFew) && p.comfort <= 2 && !usesBiz) return "Overwhelmed Curious";
  if (open && p.comfort <= 3 && !usesBiz && !bullish) return "Overwhelmed Curious";
  if (notInterested && p.comfort <= 2) return "Passive Bystanders";
  if (notInterested && !usesBiz && p.comfort <= 3) return "Passive Bystanders";
  return "Cautious Holdbacks";
}
function dedupeByEmail(arr) {
  const seen = new Set();
  return arr.filter(r => { const k = r.email.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
}
const ALL_CANDIDATES = dedupeByEmail(RAW_CANDIDATES).map(r => ({ ...r, segment: getCandidateSegment(r), region: getCandidateRegion(r.state) }));

          <button key={v} onClick={() => setView(v)} style={{ padding: "7px 16px", borderRadius: 20, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, background: view === v ? ACCENT : "#fff", color: view === v ? "#fff" : "#555", boxShadow: view === v ? "0 2px 8px rgba(59,111,232,0.3)" : "0 1px 4px rgba(0,0,0,0.08)" }}>{label}</button>
        ))}
      </div>
      {view === "themes" && (
        <>
          <div style={{ background: "#EBF1FF", borderRadius: 10, padding: 14, fontSize: 13, color: "#1a3a8f" }}>
            6 themes derived from survey data — 3 P1 (clear signal, needs depth) and 3 P2 (directional, needs validation). Each includes the evidence, a hypothesis to test, and tagged segments.
          </div>
          {INTERVIEW_THEMES.map((t, i) => (
            <div key={i} style={{ background: "#fff", borderRadius: 10, boxShadow: "0 1px 6px rgba(0,0,0,0.07)", overflow: "hidden", border: "1px solid #edf1fa" }}>
              <div onClick={() => setOpenTheme(openTheme === i ? null : i)} style={{ padding: "14px 18px", cursor: "pointer", display: "flex", alignItems: "flex-start", gap: 12 }}>
                <div style={{ fontSize: 11, fontWeight: 800, color: t.color, background: t.color + "18", padding: "3px 8px", borderRadius: 6, flexShrink: 0, marginTop: 1 }}>{t.priority}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: "#1a1a2e", lineHeight: 1.4, marginBottom: 6 }}>{t.title}</div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {t.segments.map((s, j) => <Badge key={j} text={s} color={t.color} />)}
                  </div>
                </div>
                <div style={{ fontSize: 16, color: "#aaa", flexShrink: 0, marginTop: 2 }}>{openTheme === i ? "▲" : "▼"}</div>
              </div>
              {openTheme === i && (
                <div style={{ borderTop: "1px solid #f0f2f8", padding: "16px 18px", display: "grid", gap: 14 }}>
                  <div>
                    <SectionLabel text="Why this matters" color="#888" />
                    <div style={{ fontSize: 13, color: "#444", lineHeight: 1.6 }}>{t.why}</div>
                  </div>
                  <div>
                    <SectionLabel text="Suggested questions" color={t.color} />
                    <div style={{ display: "grid", gap: 6 }}>
                      {t.questions.map((q, j) => (
                        <div key={j} style={{ display: "flex", gap: 10, padding: "8px 12px", background: "#f8f9fc", borderRadius: 8 }}>
                          <div style={{ width: 6, height: 6, borderRadius: "50%", background: t.color, marginTop: 5, flexShrink: 0 }} />
                          <div style={{ fontSize: 13, color: "#333", lineHeight: 1.5, fontStyle: "italic" }}>{q}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div style={{ background: t.color + "10", border: `1px solid ${t.color}30`, borderRadius: 8, padding: "10px 14px" }}>
                    <SectionLabel text="Hypothesis to test" color={t.color} />
                    <div style={{ fontSize: 13, color: "#333", lineHeight: 1.5 }}>{t.hypothesis}</div>
                  </div>
                </div>
              )}
            </div>
          ))}
        </>
      )}
      {view === "gaps" && (
        <>
          <div style={{ background: "#EBF1FF", borderRadius: 10, padding: 14, fontSize: 13, color: "#1a3a8f" }}>
            Things the survey surfaced but couldn't answer — question design issues, coverage gaps, and signals hiding in open-text responses. These should shape interview screening and guide.
          </div>
          {INTERVIEW_GAPS.map((g, i) => {
            const tc = gapTypeConfig[g.type] || { color: "#888", label: g.type };
            return (
              <div key={i} style={{ background: "#fff", borderRadius: 10, boxShadow: "0 1px 6px rgba(0,0,0,0.07)", overflow: "hidden", border: "1px solid #edf1fa", borderLeft: `4px solid ${tc.color}` }}>
                <div onClick={() => setOpenGap(openGap === i ? null : i)} style={{ padding: "14px 18px", cursor: "pointer", display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ flex: 1, fontSize: 14, fontWeight: 700, color: "#1a1a2e", lineHeight: 1.4 }}>{g.title}</div>
                  <Badge text={tc.label} color={tc.color} />
                  <div style={{ fontSize: 16, color: "#aaa", flexShrink: 0 }}>{openGap === i ? "▲" : "▼"}</div>
                </div>
                {openGap === i && (
                  <div style={{ borderTop: "1px solid #f0f2f8", padding: "14px 18px", display: "grid", gap: 10 }}>
                    <div style={{ fontSize: 13, color: "#444", lineHeight: 1.6 }}>{g.detail}</div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                      <div style={{ background: "#fff5f3", borderRadius: 6, padding: "8px 12px" }}>
                        <SectionLabel text="Impact" color={ORANGE} />
                        <div style={{ fontSize: 12, color: "#555", lineHeight: 1.5 }}>{g.impact}</div>
                      </div>
                      <div style={{ background: "#edf7f1", borderRadius: 6, padding: "8px 12px" }}>
                        <SectionLabel text="Fix in interviews" color={GREEN} />
                        <div style={{ fontSize: 12, color: "#555", lineHeight: 1.5, fontStyle: "italic" }}>{g.fix}</div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </>
      )}
      {view === "guide" && (
        <>
          <div style={{ background: "#EBF1FF", borderRadius: 10, padding: 14, fontSize: 13, color: "#1a3a8f" }}>
            General question guide — use opening/closing with everyone, tailor middle sections to segment. Questions derived from the 6 themes above.
          </div>
          {[{ category: "Opening / context", color: "#555", questions: ["Tell me about your business — team size, type of work?", "Walk me through a typical week. What takes up most of your time?", "What software are you using and what do you actually use it for day-to-day?"] }, { category: "Pain points", color: ACCENT, questions: ["What's the part of your job you'd most like to hand off to someone else?", "Walk me through creating an estimate start to finish. Where does it slow down?", "What's something you do almost exactly the same way every single time?", "When you're really stretched — what's the thing that starts slipping?"] }, { category: "AI attitudes", color: PURPLE, questions: ["Do you use any AI tools today — inside or outside your business software?", "When you hear 'AI feature' in software — what do you picture?", "Has a tool ever done something automatically that you wished it hadn't? What happened?", "Is there a word or framing that would make you more or less likely to try something?"] }, { category: "Trust & control", color: ORANGE, questions: ["If AI drafted an estimate for you — what would reviewing it look like? Would you edit it or just approve?", "What specific mistake would you be most worried about AI making?", "If it got things right 90% of the time, would that be good enough? What about 95%? 99%?", "Is there anything you'd never want AI to handle — even with review?"] }, { category: "Roofr-specific", color: GREEN, questions: ["What's the thing you do most often in Roofr right now?", "If Roofr added an AI feature tomorrow — what would you need to see before you turned it on?", "Is there anything you wish Roofr could do automatically that you currently do manually?", "One customer built a custom AI-backed CRM. What would have to be true for you to do something like that?"] }, { category: "Closing", color: "#555", questions: ["If you imagine Roofr two years from now — what would make it feel essential?", "Is there anything you expected me to ask that I didn't?", "Who else on your team would we benefit from talking to?"] }].map((cat, i) => (
            <div key={i} style={{ background: "#fff", borderRadius: 10, padding: "12px 18px", boxShadow: "0 1px 6px rgba(0,0,0,0.07)", borderLeft: `4px solid ${cat.color}` }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: cat.color, marginBottom: 10 }}>{cat.category}</div>
              <div style={{ display: "grid", gap: 6 }}>
                {cat.questions.map((q, j) => (
                  <div key={j} style={{ display: "flex", gap: 10, padding: "7px 12px", background: "#f8f9fc", borderRadius: 6 }}>
                    <div style={{ width: 5, height: 5, borderRadius: "50%", background: cat.color, marginTop: 6, flexShrink: 0 }} />
                    <div style={{ fontSize: 13, color: "#333", lineHeight: 1.5, fontStyle: "italic" }}>{q}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </>
      )}
      <div style={{ background: "#1a1a2e", borderRadius: 10, padding: 16 }}>
        <SectionLabel text="Screening criteria" color="#aab4cc" />
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          {["Active Adopters: 5–8 · Overwhelmed Curious: 4–6 · Cautious Holdbacks: 5–8 · Passive Bystanders: 2–3 (directional)", "Geographic spread — at least 3 Canadian respondents", "Role mix — owners, office admins, sales reps", "Size spread — at least 2 from each tier (solo, 6–15, 16+)", "Work type — at least 4 insurance-focused contractors", "Priority — find the respondent who built a custom Gemini-backed CRM"].map((c, i) => (
            <div key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
              <div style={{ width: 5, height: 5, borderRadius: "50%", background: ACCENT, marginTop: 6, flexShrink: 0 }} />
              <div style={{ fontSize: 12, color: "#e8edf8", lineHeight: 1.5 }}>{c}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function CandidatesTab() {
  const [segFilter, setSegFilter] = useState("all");
  const [regionFilter, setRegionFilter] = useState("all");

  let filtered = ALL_CANDIDATES;
  if (segFilter !== "all") filtered = filtered.filter(r => r.segment === segFilter);
  if (regionFilter !== "all") filtered = filtered.filter(r => r.region === regionFilter);

  const counts = {};
  CAND_SEG_ORDER.forEach(s => { counts[s] = 0; });
  ALL_CANDIDATES.forEach(r => { counts[r.segment] = (counts[r.segment] || 0) + 1; });

  const bySegment = {};
  filtered.forEach(r => { if (!bySegment[r.segment]) bySegment[r.segment] = []; bySegment[r.segment].push(r); });

  return (
    <div style={{ display: "grid", gap: 14 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 12 }}>
        <div style={{ background: "#fff", borderRadius: 10, padding: 14, boxShadow: "0 1px 6px rgba(0,0,0,0.08)", borderTop: `3px solid ${ACCENT}`, textAlign: "center" }}>
          <div style={{ fontSize: 30, fontWeight: 800, color: ACCENT }}>{ALL_CANDIDATES.length}</div>
          <div style={{ fontSize: 11, color: "#555", marginTop: 4 }}>Total opted in</div>
        </div>
        {CAND_SEG_ORDER.map(s => (
          <div key={s} style={{ background: "#fff", borderRadius: 10, padding: 14, boxShadow: "0 1px 6px rgba(0,0,0,0.08)", borderTop: `3px solid ${CAND_SEG_CONFIG[s].color}`, textAlign: "center" }}>
            <div style={{ fontSize: 30, fontWeight: 800, color: CAND_SEG_CONFIG[s].color }}>{counts[s] || 0}</div>
            <div style={{ fontSize: 11, color: "#555", marginTop: 4 }}>{s}</div>
          </div>
        ))}
      </div>
      <div style={{ background: "#EBF1FF", borderRadius: 10, padding: 14, fontSize: 13, color: "#1a3a8f" }}>
        <strong>Segments remapped</strong> to the 4-segment model. Filter by segment and region to build a diverse shortlist.
      </div>
      <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
        <span style={{ fontSize: 13, color: "#555" }}>Filter:</span>
        <select value={segFilter} onChange={e => setSegFilter(e.target.value)} style={{ fontSize: 13, padding: "6px 10px", borderRadius: 6, border: "1px solid #dde3f0", background: "#fff", color: "#333", cursor: "pointer" }}>
          <option value="all">All segments</option>
          {CAND_SEG_ORDER.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <select value={regionFilter} onChange={e => setRegionFilter(e.target.value)} style={{ fontSize: 13, padding: "6px 10px", borderRadius: 6, border: "1px solid #dde3f0", background: "#fff", color: "#333", cursor: "pointer" }}>
          <option value="all">All regions</option>
          <option value="US">United States</option>
          <option value="Canada">Canada</option>
        </select>
        <span style={{ fontSize: 12, color: "#888" }}>Showing {filtered.length} of {ALL_CANDIDATES.length} candidates</span>
      </div>
      {CAND_SEG_ORDER.map(seg => {
        const list = bySegment[seg];
        if (!list || !list.length) return null;
        const cfg = CAND_SEG_CONFIG[seg];
        return (
          <div key={seg}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: cfg.bg, border: `1px solid ${cfg.border}`, borderRadius: "8px 8px 0 0", padding: "10px 16px" }}>
              <span style={{ fontWeight: 700, fontSize: 14, color: cfg.color }}>{seg}</span>
              <span style={{ fontSize: 12, fontWeight: 600, background: cfg.color, color: "#fff", borderRadius: 12, padding: "2px 10px" }}>{list.length} candidates</span>
            </div>
            <div style={{ background: "#fff", border: `1px solid ${cfg.border}`, borderTop: "none", borderRadius: "0 0 8px 8px", overflow: "hidden", boxShadow: "0 1px 6px rgba(0,0,0,0.06)" }}>
              <div style={{ display: "grid", gridTemplateColumns: "minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)", gap: 8, padding: "6px 16px", background: "#f8f9fc", borderBottom: "1px solid #edf1fa" }}>
                {["Email", "State / Province", "Role", "Company size"].map(h => (
                  <span key={h} style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", letterSpacing: "0.04em" }}>{h}</span>
                ))}
              </div>
              {list.map((r, i) => (
                <div key={r.email} style={{ display: "grid", gridTemplateColumns: "minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)", gap: 8, padding: "9px 16px", fontSize: 13, background: i % 2 === 0 ? "#fff" : "#fafbff", borderBottom: i < list.length - 1 ? "1px solid #f0f2f8" : "none", alignItems: "center" }}>
                  <span style={{ color: "#1a1a2e", wordBreak: "break-all" }}>{r.email}</span>
                  <span style={{ color: "#555" }}>{r.state}</span>
                  <span style={{ color: "#555" }}>{r.role}</span>
                  <span style={{ color: "#555" }}>{r.size}</span>
                </div>
              ))}
            </div>
          </div>
        );
      })}
      {filtered.length === 0 && (
        <div style={{ background: "#fff", borderRadius: 10, padding: 24, textAlign: "center", color: "#888", fontSize: 14 }}>No candidates match the current filters.</div>
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("exec");
  return (
    <div style={{ fontFamily: "Inter, -apple-system, BlinkMacSystemFont, sans-serif", background: "#F5F7FC", minHeight: "100vh", padding: 20 }}>
      <div style={{ maxWidth: 920, margin: "0 auto" }}>
        <div style={{ marginBottom: 22 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: ACCENT, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 }}>Roofr · AI Research · Jun 2026</div>
          <h1 style={{ fontSize: 22, fontWeight: 900, color: "#1a1a2e", margin: 0 }}>AI Perception — Research Hub</h1>
          <p style={{ color: "#666", fontSize: 13, marginTop: 4 }}>323 survey responses · 7 competitors audited · 3 customer segments · Interview guide</p>
        </div>
        <div style={{ display: "flex", gap: 6, marginBottom: 20, flexWrap: "wrap" }}>
          {TABS.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{ padding: "7px 16px", borderRadius: 20, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, background: tab === t.id ? ACCENT : "#fff", color: tab === t.id ? "#fff" : "#555", boxShadow: tab === t.id ? "0 2px 8px rgba(59,111,232,0.3)" : "0 1px 4px rgba(0,0,0,0.08)" }}>
              <span style={{ marginRight: 5, opacity: 0.7 }}>{t.icon}</span>{t.label}
            </button>
          ))}
        </div>
        {tab === "exec" && <ExecTab />}
        {tab === "themes" && <ThemesTab />}
        {tab === "segments" && <SegmentsTab />}
        {tab === "geo" && <GeoSizeTab />}
        {tab === "competitive" && <CompetitiveTab />}
        {tab === "interviews" && <InterviewsTab />}
        {tab === "candidates" && <CandidatesTab />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
